[pytest]
testpaths = tools .
python_files = test_*.py
asyncio_mode = auto
# test_verify_changes.py is a standalone manual verification SCRIPT (it calls
# sys.exit() at module top level), not a pytest module. Collecting it crashes
# the whole run with an INTERNALERROR, so exclude it from collection. Run it
# directly with `python test_verify_changes.py` when you want it.
addopts = --ignore=test_verify_changes.py
# `.claude` holds vendored SKILL scaffolding, and four of those skills ship their
# own pytest files that shell out to real `node`/`python` subprocesses. Collected
# from the repo root they made a bare `python -m pytest` hang indefinitely — the
# run never reached a summary — which read as "the suite is slow" rather than
# "the suite is stuck on third-party fixtures". They are not EraOne's tests; run
# them from inside their own skill directory if you ever need them.
norecursedirs = node_modules .git .claude .swarm .claude-flow .phase*_backups graphify-out source_code_folder models ui_src __pycache__ .pytest_cache .ruff_cache
markers =
    slow: marks tests as slow; deselect with -m "not slow"
    unit: unit tests
    integration: integration tests
    smoke: smoke tests
