[pytest]
testpaths = tools .
python_files = test_*.py
asyncio_mode = auto
# test_verify_changes.py is a standalone manual verification SCRIPT (it calls
# sys.exit() at module top level), not a pytest module. Collecting it crashes
# the whole run with an INTERNALERROR, so exclude it from collection. Run it
# directly with `python test_verify_changes.py` when you want it.
addopts = --ignore=test_verify_changes.py
# `.claude` holds vendored SKILL scaffolding, and four of those skills ship their
# own pytest files that shell out to real `node`/`python` subprocesses. Collected
# from the repo root they made a bare `python -m pytest` hang indefinitely — the
# run never reached a summary — which read as "the suite is slow" rather than
# "the suite is stuck on third-party fixtures". They are not EraOne's tests; run
# them from inside their own skill directory if you ever need them.
#
# `runtime` is DATA, not code to test — but it holds a copy of the standalone
# verify script under runtime/development/<id>/workspace/test_verify_changes.py,
# and collecting that copy imports it: the script sys.exit(1)s at module level
# (it is a manual checker, not a pytest module), which pytest reports as an
# INTERNALERROR that aborts the ENTIRE run. One stale workspace copy therefore
# took down every test in the repo, so the tree is excluded outright.
norecursedirs = node_modules .git .backups .claude.swarm .claude-flow .phase*_backups graphify-out source_code_folder models ui_src runtime __pycache__ .pytest_cache .ruff_cache
# A hung test used to be indistinguishable from a slow one: the run simply never
# reached a summary. That is precisely why the 2026-09-29 suite-time jump
# (13:36 -> 23:48) could not be diagnosed from the run itself, and why board item
# 18 exists. With a ceiling, a hang dumps every thread's stack and NAMES the test.
#
# 120s is measured headroom, not a guess: the slowest real test in the suite is
# 19.0s (test_watch_page_no_video_no_player_timeout), and the 15 slowest are all
# deliberate-timeout paths under 20s. The one genuine exception is
# test_script_passes_in_its_own_process, which shells out with its own 600s
# ceiling; it carries an explicit @pytest.mark.timeout rather than lifting the
# ceiling for all 5,300 tests to suit one of them.
#
# timeout_method is deliberately NOT set. pytest-timeout already picks the right
# one per platform (HAVE_SIGALRM -> "signal", else "thread"), and that default is
# better than either choice pinned: on Windows, Era's real platform, "thread"
# dumps every stack and ends the process, while on Linux "signal" fails the one
# test and lets the remaining 5,300 finish. Pinning "thread" for Windows'
# benefit would throw away the rest of the run everywhere else.
timeout = 120
markers =
    slow: marks tests as slow; deselect with -m "not slow"
    unit: unit tests
    integration: integration tests
    smoke: smoke tests
