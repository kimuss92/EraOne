# ============================================================================
# BRAND REGISTRY — single source of truth for routing.
# Era One resolves a brand key from what you say; Claude reads THIS FILE (never
# its memory) to decide handles, account IDs, folders, and posting times.
# A wrong value here is the ONLY way a post can reach the wrong page — so treat
# this file as the seatbelt. Fill EVERY field before a brand goes live.
# ============================================================================

# ---- Global defaults (a brand can override any of these) -------------------
defaults:
  timezone: "Africa/Tunis"          # UTC+1
  language: "fr"                    # caption language
  encoding: "utf-8"                 # ALWAYS utf-8 (é è à ç û î ô œ « » — ')
  hashtag_max: 5
  approval_required: true           # two gates: plan + assets. never auto-publish.
  cleanup_after_days: 7             # unapproved files older than this -> trash

  # publishing tools (shared across brands) — all through Composio.
  # TikTok is live for Delta Cuisine (verified 2026-07-08, see brand override
  # below) — Ceram Quartz's TikTok is NOT connected yet, so it stays excluded
  # from that brand's routing until it is (see each brand's routing override).
  facebook_tool: "composio"
  gmail_tool: "composio"
  instagram_tool: "composio"
  tiktok_tool: "composio"           # overridden off only where a brand excludes tiktok from routing

  # content routing matrix
  routing:
    reel: [instagram, tiktok, facebook]
    carousel: [instagram, facebook]          # NEVER tiktok

  # --- Meta Ads (paid) — shared across every brand ---
  # facebook-ads MCP's OAuth token lives in ONE account (the freelance one),
  # verified live 2026-07-20 headless (mcp__facebook-ads__* tools including
  # ads_create_ad_set/ads_activate_entity confirmed reachable from a `claude -p`
  # run under this config dir). era_dispatch.run_task() overrides
  # claude_config_dir to THIS value for every task_type=="ads" run, regardless
  # of which brand — never a brand's own claude_config_dir, which was never
  # authorized for facebook-ads.
  ads_claude_config_dir: "C:\\Users\\nesri\\.claude-freelance"

  # --- Global (non-brand) schedules ---
  # These run ONCE, not once per brand. era_scheduler.GLOBAL_TASK_MAP is the
  # allow-list; an unknown key here is ignored rather than obeyed.
  schedules:
    vault_maintenance:
      # 03:10 daily. Overnight because the pass rewrites two Era-owned notes in
      # the Obsidian vault, and Obsidian syncing a file out from under you while
      # you have it open is a merge conflict nobody asked for.
      cron: "10 3 * * *"
      enabled: true

