    # Never mix: an Arabic body gets THIS footer, a French body gets caption_footer.
    caption_footer_ar: |
      ما تترددش باش تاخو فكرة على الأسعار وتكتشف التشكيلة الكاملة! الفريق متاعنا ديما هوني باش ينصحك ويعاونك تختار الأحسن لدارك.
      📩 ابعثلنا ميساج على الصفحة
      📞 ولا كلمنا على: 98.522.200/98.522.210
      📍 مرحبا بكم في المقر متاعنا في سكرة.
    # PRICE is a per-campaign variable (Era gets it in the brief). The price BADGE
    # keeps a FIXED position + style; only the number changes. 470 DT/m² TTC was a
