    # DESIGN RULES (added 2026-07-29). Until now this brand had NO design_rules
    # block, so build_brief's design_note rendered EMPTY for every Ceram Quartz
    # run — the hard visual constraints existed only in CERAM_QUARTZ_CHARTER.md,
    # which the headless child had to think to open. Everything below is
    # transcribed from that charter (the section numbers are cited per key) so it
    # is injected verbatim into every brief. The charter stays the long-form
    # source of truth; if the two ever disagree, brands.yaml wins (that is the
    # documented precedence) — so fix BOTH when a rule changes.
    design_rules:
      material_selection:
        decide: "autonomous — the CM picks which slab to feature from texture_folder
          and states the exact name. NEVER ask the user which slab to use."
        must_state: "the plan names the exact slab (e.g. 'La Luna') and one line on
          why it fits the concept"
        vary_across_week: "do not feature the same slab twice in one week's assets"
        one_product_rule: "ONE product per post/slide/carousel — never two slabs in
          the same piece (charter §4.4)"
        source_of_truth: "the TEXTURES/ folder governs. A slab becomes usable the
          moment its image is dropped in — no list to edit by hand (charter §5)"
        never: "invent a slab name, a price, or a product benefit; feature a name
          that has no image in texture_folder (e.g. Pantheon, charter §5)"
      palette:
        # charter §2 — sampled from the logo. Cyan is emphasis ONLY.
        system: "teal + cyan + white is the ENTIRE brand system"
        petrol_teal_primary: "#133C4F — logo background, name bars, solid brand backgrounds"
        teal_mid: "#1D4757 — price-badge fill, footer band"
        teal_footer_tint: "#315864 / #38636F — footer band over photos"
        gradient: "#063340 / #013949 (deep) up to #106B80 (bright) — promo-poster
          background"
        accent_cyan: "#18E4E4 (range #17E0E0–#2BB8CC) — PRIX, QUARTZ label, PROMO,
          material headings, icons"
        white: "#FFFFFF — primary text, logo mark, wordmark"
        charcoal: "#23272A — render cabinetry, kitchen-render context only"
        never: "introduce any accent colour outside this system, or set body text
          in cyan (cyan is for emphasis only)"
      typography:
        # charter §3
        promo_headline: "heavy condensed sans, BOLD ITALIC, uppercase, cyan + white
          split"
        material_name: "bold condensed sans, uppercase, white"
        labels_kicker: "medium sans, uppercase, letter-spaced, cyan #18E4E4"
        price_badge: "bold sans uppercase — white number, cyan 'PRIX' and 'M² TTC'"
        feature_bullets: "regular/medium sans, uppercase, white, short benefit lines"
        footer: "regular sans — labels lighter, values bold, white on the teal band"
        fallback_stack: "if a source font is missing: headlines -> heavy condensed
          grotesque (Anton / Bebas-style); body and labels -> Montserrat or Poppins"
        never: "retype the 'CERAM QUARTZ' wordmark by hand — it is part of the logo
          lockup, always use the logo file (charter §4.1, §11)"
      fixed_components:
        # charter §4 — present on every post.
        logo: "Q monogram + CERAM QUARTZ lockup, TOP-LEFT, ~25px inset, white version
          on photos/teal. Use the provided file, never redraw."
        contact_footer: "bottom band (teal, or teal over the photo), two lines — 'ADRESSE:
          LA SOUKRA' and 'CONTACT: +216 98 522 200', labels light, values bold. On
          single posts add bottom-right: FB + IG glyphs + CERAMQUARTZ."
        price_badge: "teal CIRCLE, bottom-right, three stacked lines: PRIX (cyan,
          small) / <PRICE> (white, large) / M² TTC (cyan, small). The badge's POSITION,
          SIZE, SHAPE and STYLE are FIXED; only the number changes."
        price_is_a_variable: "the price VALUE is per-campaign, filled from the campaign
          brief. 470DT was one past campaign, NOT a standing price. No active campaign
          -> OMIT the PRIX group entirely rather than show a stale price (charter
          §4.3)."
        material_name_bar: "the standard carousel cover name-bar is a SINGLE line
          — bold white uppercase product name alone. NO cyan 'QUARTZ' kicker above
          it. The kicker exists only in the normally-hidden promo-headline layer group;
          adding it to a regular cover was a past drift, not the design (charter §4.4)."
      approved_claims:
        # charter §4.5 — the ONLY six benefit claims that exist. Never invent a seventh.
        slide_2_fixed_set: "slide 2 of EVERY carousel uses this exact set, this exact
          order, these exact icons — it does NOT rotate and is NOT picked per product:
          1) FAIBLE ABSORPTION D'EAU (water-drop icon), 2) LONGUE DURÉE DE VIE (recycle-loop
          icon), 3) RÉSISTANT AUX PRODUITS MÉNAGERS (spray-bottle icon)"
        other_approved_copy: "SURFACE 100% NON-POREUSE / ULTRA-RÉSISTANT AUX RAYURES
          / ENTRETIEN FACILE AU QUOTIDIEN — approved for other uses, but NOT the slide-2
          set"
        never: "invent a claim beyond these six, or reorder/substitute the slide-2
          three"
      carousel:
        # charter §6 — the master template is offre.psd (project root).
        canvas: "1080x1350, 4:5"
        build_method: "generate the photos in the Ceram Quartz Magnific Space FIRST,
          then PLACE them into offre.psd's image slots in REAL Photoshop via the `photoshop`
          MCP. NEVER freehand-recreate the layout in another tool — that is exactly
          what caused the previous drift."
        never_overwrite_master: "save the populated result as a NEW file (<item>_slideN.psd
          or straight to PNG); offre.psd stays a clean template"
        slide_1_cover: "layer groups: `top image` + `Texture` + `Fixed names` (name-bar
          + product-name text) + `FOOTER` + `LOGO` (+ `PRIX` only if a promo is active)"
        slide_2_detail_facts: "`full image` + `fact` (the fixed 3 facts above) + `FOOTER`
          + `LOGO` (+ `PRIX` if promo)"
        slides_3_4_in_situ: "`full image` + `FOOTER` + `LOGO` only — no name-bar,
          no facts. A DIFFERENT camera angle of the same kitchen per slide (island
          / waterfall edge / sink / backsplash). NEVER repeat an angle within one
          carousel."
        slide_5_cta: "NOT built from offre.psd — it is the fixed, reusable brand outro
          asset (teal background + Q monogram + tagline), reused VERBATIM across every
          carousel, never regenerated per item"
        every_slide: "logo top-left + contact footer on every slide 1-4"
      promo_poster:
        # charter §7
        background: "teal diagonal/radial gradient #063340 -> #106B80"
        subject: "slab leaning in a minimalist room (product hero), soft floor shadow"
        layout: "top-right BIG PROMO (bold italic, cyan + white) + small QUARTZ; left
          PRIX UNIQUE + big cyan price + thin connector line to the slab; lower-left
          cyan QUARTZ kicker + white material name + 3 feature bullets; contact footer
          at the bottom"
        feel: "clean, lots of teal negative space"
      reel:
        # charter §8 — 9:16, 1080x1920. Two types, pick one per reel.
        showcase: "hero slab macro -> in-situ kitchen shots (countertop, waterfall,
          backsplash) -> detail veining close-ups -> clean exit. Cyan material-name
          label shown ONCE on its best shot. NO voice-over. Elegant cool electronic
          bed, 100-120 BPM, instrumental, full length with a 2.5s fade-out."
        promo: "same visual system PLUS the price badge (campaign price) and the offer.
          French voice-over allowed HERE ONLY; music ducks under the VO and returns
          after. Repeat the offer/CTA at the end."
        production: "if produced via Magnific, use the Ceram Quartz Space with Ceram
          Quartz slab textures — NEVER mix in Delta Cuisine assets or branding"
      in_situ_context:
        setting: "modern handleless kitchens — the slab is the HERO, shot as macro
          texture and in situ (charter §1)"
        cabinetry: "charcoal #23272A in render context"
        feel: "modern, cool, premium, clean — cooler and more showroom/product than
          Delta Cuisine"
      safe_zones:
        # charter §9
        carousel: "logo top-left inset ~25px; keep text OUT of the bottom band reserved
          for the contact footer"
        reel: "no key content in the top ~220px (IG bars) or bottom ~450px (caption/CTA).
          Price badge sits bottom-right but ABOVE the action buttons."
      never:
        # charter §11 — the drift guards, verbatim.
      - "use any colour outside the teal + cyan + white system"
      - "place Delta Cuisine's logo, badge (Élu 2026), footer or phone number on Ceram
        Quartz content — or Ceram Quartz branding on Delta Cuisine content"
      - "post Ceram Quartz to TikTok — this brand is Instagram + Facebook only"
      - "invent a product benefit or a price — use the approved lists above"
      - "retype the CERAM QUARTZ wordmark by hand — use the logo file"

