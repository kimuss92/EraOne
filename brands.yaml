    schedules:
      # Staggered deliberately: DC = Friday, Ceram Quartz = Tuesday. Both brands
      # share ONE Magnific/Adobe login, so running them on different days spreads
      # generation-credit spend across the week instead of spiking it on one day,
      # and avoids one brand's full pipeline queuing for hours behind the other's.
      weekly_plan: {cron: "0 11 * * 2", enabled: false}     # Tue 11:00 — enable when live
      auto_publish: {cron: "0 0 * * *", enabled: false}     # Tue 20:00

