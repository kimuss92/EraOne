    # --- interior-design rules (HARD constraints on every kitchen/wardrobe render) ---
    # These are the material/harmony laws for Delta Cuisine creations. The
    # interior-design skill (.claude/skills/interior-design/SKILL.md) runs these as a
    # pre-generation checklist; a render that violates ANY of them is wrong and
    # must be reworked BEFORE it counts as an asset.
    #
    # MATERIALS ARE THE CM'S DECISION (changed 2026-07-09). The CM has everything it
    # needs to choose: the swatch library (texture_folder), the harmony laws below,
    # the wardrobe conception references, and the brand's past posts. It PICKS the
    # material family + exact swatch name itself, STATES the pick and the reason in
    # the plan, and never asks the user "quartz or ceramic?". The user corrects a
    # pick at plan review ("change reel 1's texture") — that is the control, not a
    # question mid-run.
    design_rules:
      material_selection:
        decide: "autonomous — the CM picks the material family and the exact swatch
          name from texture_folder. NEVER ask the user which material to use."
        must_state: "the plan names the chosen family + exact swatch (e.g. 'Quartz
          — Nero Stellar') and one line on why it fits the concept"
        vary_across_week: "do not repeat the same swatch twice in one week's assets"
        never: "invent a material name, or use a swatch that is not a real file in
          texture_folder"
      kitchen:
        # REPLACED 2026-07-20 with the exact build formula from
        # D:\my workflow\CLAUDE.md (2026-07-19), recorded there as "Karim's fixed
        # build rule — every future kitchen visual must follow this exactly".
        # The previous wording here ("one or two textures maximum", "tall glass
        # present in most kitchens") said roughly the same thing far more loosely
        # and left the CM to guess WHICH surface got WHICH material. The formula
        # below assigns every surface explicitly, so a render can be checked
        # against it instead of argued about.
        #
        # THE THREE-MATERIAL FORMULA — exactly one swatch in each of three roles:
        composition_formula:
          stone: "ONE quartz OR ceramic texture — used ONLY on the island countertop,
            its waterfall edges, and the backsplash. Nowhere else."
          wood: "ONE wood-grain finish — ALL lower cabinetry facades, matched exactly
            across every lower unit."
          plain: "ONE solid lacquer colour — ALL upper cabinetry facades."
        material_family: "one stone family per kitchen — either céramique OR quartz,
          NEVER both in the same kitchen"
        # These are fixed brand furniture, NOT part of the three-material count.
        tall_cabinetry: "ALWAYS dark glass. Fixed — does not count as one of the three
          materials above."
        plinth: "kitchen base/plinth is ALWAYS black matte aluminium"
        appliances: "ALWAYS Whirlpool or Rosières branded — never generic, never any
          other brand"
        # SINK + FAUCET (HARD constraint, added 2026-07-21, Karim). The faucet is
        # a metal fixture, NOT part of the stone/wood/plain material count and it
        # must NEVER be rendered in the worktop's stone material (no quartz/ceramic
        # faucet). It is always a metal finish — inox (stainless), matte black, or
        # silver/chrome — and the CM picks whichever of those best complements the
        # chosen worktop swatch's colour and the kitchen's palette. Same logic for
        # the sink where a metal sink is shown.
        sink_faucet: "the faucet is ALWAYS a metal finish — inox (brushed stainless),
          matte black, or silver/chrome — NEVER the worktop's stone material and never
          a painted/coloured novelty finish. CHOOSE the metal that best complements
          the chosen worktop swatch and the kitchen palette (e.g. matte black against
          a warm/pale quartz, brushed inox against a dark or veined stone), and STATE
          the chosen faucet finish in the plan with a one-line reason. An undermount/inset
          metal sink follows the same finish logic."
        harmony: "the stone/wood/plain combination must be harmonious — no clashing
          finishes"
        never: "a fourth material, a second stone texture, mismatched lower cabinet
          facades, an unbranded/other-brand appliance, or a faucet rendered in the
          worktop's stone material"
      wardrobe:
        # CORRECTED 2026-07-20 from D:\my workflow\CLAUDE.md (rule set 2026-07-19).
        # The list here had "one texture, lacquered or laminated" AND "one texture
        # only" — a near-duplicate pair — and was MISSING the third real option,
        # the combination. Karim's actual rule is these three; pick exactly ONE.
        # RE-CONFIRMED 2026-07-20 (same day) against Karim's own "MASTER PROMPT —
        # Modern Modular Wardrobe Render" (CONFIG_A/B/C) — the two describe the
        # same three configurations in different words. Full prompt template,
        # variable table and negative prompt: vault
        # Resources/Delta_Cuisine_Wardrobe_Master_Prompt.md.
        allowed_configurations:
        - "one texture, lacquered or laminated"          # = CONFIG_A (no glass)
        - "all glass doors with a laminated-wood interior"  # = CONFIG_B
        - "combination: one lacquered/laminated texture PLUS glass doors with a laminated-wood
          interior"                                      # = CONFIG_C

        # --- SHOT VARIETY (HARD constraint, added 2026-07-20) ---
        # Karim's correction after the first test Reel: shots repeated each other.
        # Every shot in a Reel must be a DIFFERENT camera treatment — the set
        # below is the approved vocabulary, one shot per type, never two of the
        # same type in one Reel. They must work as complementary B-roll, i.e.
        # they cut together as one sequence rather than reading as variants of
        # the same photo.
        shot_variety:
          required_distinct_types:
          - "hero / commercial clean establishing (full wardrobe, straight-on)"
          - "medium three-quarter"
          - "close-up (door line, handle, shadow gap)"
          - "macro (material grain / finish texture, very tight)"
          - "low angle (down-top, looking up the vertical)"
          - "top-down / high angle (looking down into an open module or drawer)"
          - "artistic (moody editorial light, dramatic composition)"
          never: "two shots of the same type in one Reel, or any shot that reads as
            a near-duplicate of another — every clip must earn its place"

          # --- ORDERED SLOT MAP (added 2026-07-21, Karim) ---
          # The v4 Reel still repeated angles: the close-up and the macro were
          # both prompted onto the same subject (handle + door edge + shadow
          # gap), so they read as one shot twice. Naming a shot type is NOT
          # enough — each slot must be locked to a DIFFERENT SUBJECT as well as
          # a different camera position, and the slots must alternate scale so
          # the montage breathes. This is the running order of the Reel.
          ordered_slots:
          # RESOLVED 2026-07-21 by Karim: the hero IS fully closed. The earlier
          # note here said it could not be, because `accessories.required` reads
          # as per-image. Karim's call: accessory visibility is satisfied ACROSS
          # THE REEL, not in every frame — the closed hero shows off the
          # uninterrupted tall facades, and the supporting shots open doors to
          # reveal the accessories. See accessories.visibility below.
          - "1 WIDE  — hero establishing, full unit straight-on, ALL DOORS CLOSED:
            the uninterrupted tall facades are the beauty shot"
          - "2 CLOSE — door line / handle / shadow gap, tight on the vertical"
          - "3 WIDE  — medium three-quarter with ONE door visibly OPEN on its hinge
            (door panel in frame), revealing the couple's hanging section"
          - "4 CLOSE — a PULL-OUT ACCESSORY in motion (shoe rack, tie/belt rack, trouser
            rack gliding out) — a different subject from slot 2"
          - "5 WIDE  — low angle, down-top up the vertical, floor-to-ceiling height"
          - "6 CLOSE — top-down into an open drawer, its front edge and dividers in
            frame"
          rhythm_rule: "WIDE / CLOSE / WIDE / CLOSE / WIDE / CLOSE — never two wides
            or two closes back to back"
          subject_rule: "no two slots may share a subject. Two different close-ups
            of the same door edge are ONE shot rendered twice, however differently
            they are described."

        # --- REFERENCE LOCK (HARD constraint, added 2026-07-21, Karim) ---
        # Zero drift: every shot in a Reel is the SAME wardrobe, in the SAME room,
        # in the same light. The hero image is the single source of truth for all
        # five supporting shots; the conception reference governs the hero.
        reference_lock:
          rule: "The hero image is the master. Every supporting shot must depict the
            SAME physical wardrobe in the SAME room: identical finish and colour,
            identical module layout, identical door division and count, identical
            handle profile, identical accessory type in the identical module position,
            identical wall/floor finish, identical light direction and colour temperature."
          may_vary: "camera position, focal length, framing, depth of field, and which
            door or drawer is open — nothing else"
          never: "a re-imagined or 'inspired by' version of the wardrobe, a different
            room, a relit scene, an extra or missing module, a changed handle, or
            a swapped accessory. Any drift from the hero is a rejected shot — re-render
            it, do not accept it as a variation."
          # ADDED 2026-07-21 (Karim, v5 still review). Three drifts he caught:
          # a shot opened a two-door swing bay the hero does not have; another
          # shot's door panel was a different shape from the hero's; and the
          # room props appeared in some shots and vanished in others.
          door_identity: "the NUMBER, WIDTH, PROPORTION and POSITION of the doors
            are fixed by the hero and identical in every shot. When a shot opens a
            module it opens exactly ONE of the hero's actual single tall door panels.
            NEVER invent a two-door swing bay, a double-door opening, a pair of doors
            opening together, or a door of a different width or shape from the hero's.
            Count the hero's doors and honour that count."
          set_dressing: "the room is a FIXED SET. The same furniture and props — bench,
            lamp, rug, bed, plant — appear in the SAME positions, at the same scale,
            in every shot where the room is visible. A prop must never appear in one
            shot and vanish in the next; if a shot's framing excludes a prop it must
            be because the crop excludes it, not because the room was redressed."
          unobstructed: "NOTHING stands in front of the wardrobe. The product is entirely
            visible from plinth to ceiling — no bench, lamp, chair, plant or bed between
            the camera and the fronts. Props sit to the SIDE of the wardrobe or behind
            the camera. An obstructed product is a rejected shot."

        # --- GENERATION METHOD (HARD constraint, added 2026-07-21, Karim) ---
        # Root cause of every drift Karim reported (layout changes between shots,
        # missing doors, swapped/generic accessories, "a different wardrobe" in
        # shots 2-3, unreal renders): the old workflow generated each of the six
        # shots from its OWN text prompt, so every shot was an independent roll and
        # identity could not hold. No prompt, however detailed, makes two separate
        # generations identical. The fix is MASTER-ANCHORED generation — full
        # procedure in `.claude/skills/wardrobe-reel-workflow/SKILL.md`.
        generation_method:
          principle: "A wardrobe Reel is SIX VIEWS OF ONE WARDROBE, not six wardrobes.
            Generate the wardrobe ONCE (the master image), then DERIVE every other
            shot FROM that image. Nothing after the master is generated from text
            alone — identity is inherited, never re-rolled."
          step_1_master: "Generate the MASTER first with images_generate (9:16): the
            FULLY-OPEN wardrobe, doors open on visible hinges, hanging section, drawers,
            and the chosen accessories (starax hanger lift mid-travel + 2 others)
            in their stated modules. INPUTS ARE SEPARATE, NEVER FUSED, and each is
            @-mentioned by name in the prompt-generator (Karim 2026-07-22): (a) the
            conception_reference is the ONLY source of layout/module division/proportions
            — do NOT take layout from accessory or texture images; (b) the material
            is ONE named swatch from texture_folder, attached as its own @TEXTURE
            node (e.g. tobbaco walnut laminate for a walnut interior); (c) EACH accessory
            is its own @-named reference photo (@starax hanger lift, @belt tie rack,
            @pull-out shoe rack) so it renders true to the real product — the starax
            lift was previously ruined by a fused montage; separate + @named fixes
            it. HARD LOOK RULES: glass doors in SLIM BLACK MATTE aluminium frames,
            NO handles (push-to-open, never bronze/chrome); accessories sit INSIDE
            their modules, NEVER mounted on the doors. QC the master HARD before spending
            on anything else — every other shot inherits it, so a flawed master multiplies
            the flaw."
          step_2_derive: "Derive each supporting shot FROM the master, never from
            a fresh text prompt: ANGLE shots (three-quarter, low angle, top-down,
            tight door line) via images_change_camera on the master (rotate / vertical
            / closeup); DOOR-OPEN and ACCESSORY-IN-MOTION shots via images_generate
            with the master as an image reference. images_variations mode=angles on
            the master gives several identity-locked angles at once. EVERY shot keeps
            the EXACT same lighting as the master — same warm-white LED setup, same
            colour temperature, same mood; never let a shot drift cooler/darker (Karim
            2026-07-22). QC each derived shot against the master (reference_lock):
            identical finish, door count/width, black matte frames, accessory, room,
            lighting. Any drift = re-derive that ONE shot, never accept it as a variation."
          step_3_video: "Animate each APPROVED image with video_generate, keyframe
            start = that image's creation identifier (never a webUrl). CAMERA-ONLY
            MOTION: nothing in the shot moves — only the camera. The scene stays frozen
            exactly as the still; the sole motion is a slow camera push/pull/ orbit/glide
            matching the one chosen reel_style. QC the frames — a wardrobe that warps/melts/grows
            a door or where any object moves is rejected; re-generate with a calmer,
            purely-camera move."
          step_4_combine: "video_concatenate in ordered_slots order, then apply the
            reel-art-director self-critique bar to the whole Reel."
          # MODEL + RESOLUTION POLICY (Karim, 2026-07-22) — cost split. The master
          # is the identity anchor and the only 2K image; the six derived shots run
          # on the cheaper Flash model at 1K, which is covered by the account's
          # unlimited plan (Nano Banana Pro is not). This keeps a full Reel almost
          # free once unlimited is active, spending real credits only on the master.
          model_policy: "MASTER image: model `imagen-nano-banana-2` (Nano Banana Pro)
            at 2K — high fidelity, it is what every other shot inherits. DERIVED shots
            1-6 (images_generate for door-open/accessory/closed-hero; change-camera
            has no model choice): model `imagen-nano-banana-2-flash` (Nano Banana
            2 Flash) at 1K — unlimited-friendly. Never spend 2K / Nano Banana Pro
            on a derived shot."
          # VIDEO POLICY (Karim, 2026-07-22). Validated: Kling holds the still's
          # identity with no morphing. 720p on Kling needs a START keyframe (the
          # shot image) and forbids an end keyframe — which is exactly our flow.
          video_policy: "Animate EVERY shot with model `kling-25` (Kling 2.5), duration
            5s, aspectRatio 9:16, resolution 720p, keyframes.start = that shot's image
            creation identifier (never a webUrl, no end keyframe at 720p). This is
            unlimited-friendly. CAMERA-ONLY MOTION (Karim, hard rule 2026-07-22):
            NOTHING in the shot may move — the wardrobe, doors, drawers, clothes and
            accessories stay perfectly still, frozen exactly as the master image.
            The ONLY motion is a slow cinematic CAMERA move (pushIn / pullOut / orbit
            / glide / tilt) matching the chosen reel_style. Write the prompt as a
            camera instruction ('camera slowly pushes in, everything in the scene
            stays static'), never as an action ('door opens', 'drawer glides'). PROVEN
            PHRASING (validated 2026-07-22, fixed the object motion Kling was adding):
            open each prompt with 'treat the input as a STILL PHOTOGRAPH; animate
            it ONLY as a slow camera move over a frozen photo — a Ken Burns effect.
            The wardrobe and everything in it is 100 percent rigid and motionless
            like a printed photograph. NOTHING opens, closes, slides, sways or shifts.
            The ONLY motion is the camera <move>. No object motion whatsoever.' A
            clip where anything in the scene animates, morphs, warps, or grows/loses
            a part is REJECTED and re-generated with a calmer, purely-camera move.
            OPTIONAL (art-director's call, not the default): a day-to-night light
            time-lapse is allowed ONLY at the very END of a clip, and even then only
            the LIGHT may change, never the wardrobe geometry."
          # MUSIC POLICY (Karim, 2026-07-22). Magnific audio_music_generate is
          # BANNED for reels — it costs a lot. Reel music comes from the brand's
          # own FREE pipeline: `music_generate.py` (Google Lyria RealTime on the
          # dedicated gemini_music_api_key). Match the track to the chosen
          # reel_style, then ffmpeg-mux it under the concatenated video.
          music_policy: "NEVER use Magnific audio_music_generate for reel music —
            it is expensive. Generate the background track with the repo's free `music_generate.py`
            (Google Lyria), matched to the chosen reel_style, and mux it under the
            final concatenated Reel with ffmpeg."
          never: "generating the six shots as six independent text-to-image nodes
            (the old Space method) — that is the drift at the source. Do not fire
            the whole Space graph at once and hope; drive the master-anchored pipeline
            step by step with a QC gate between each step."

        # --- MONTAGE & TRANSITIONS (added 2026-07-21, Karim) ---
        # The v4 clips cut together as six separate videos rather than one piece.
        montage:
          motion_handoff: "each clip must END on motion that the next clip can CONTINUE.
            Direction and energy carry across the cut: if a clip ends pushing in,
            the next begins already moving inward or glides in the same screen direction.
            Never end on a hard stop followed by a move starting from stillness —
            that is the jarring cut."
          match_cut_targets: "cut on a shared graphic element wherever possible —
            a vertical door line, the handle axis, the LED strip line — so the eye
            lands in the same place across the cut"
          speed: "each clip holds a constant, unhurried speed within itself; the style
            (1 or 2) sets the overall pace, not per-clip variation"
          never: "a jump cut between two framings of the same subject, a cut that
            reverses screen direction, or a clip that starts and ends static"

        # --- REEL ANIMATION STYLE (pick exactly ONE per Reel) ---
        # The CM picks per Reel and states which; the camera motion AND the
        # generated music must both match the SAME choice. Mixing them (e.g.
        # slow-motion camera with electronic montage music) is wrong.
        reel_styles:
          style_1_cinematic_slow:
            camera: "slow motion, fluid push-in / push-out, smooth glides, long unhurried
              takes"
            music: "cinematic score with a soft underlying beat"
          style_2_modern_montage:
            camera: "speed ramps, snappier multi-shot montage cutting, modern commercial
              pacing"
            music: "electronic beats, montage-driven"
          rule: "state the chosen style in the plan; camera and music must match the
            same style number"

        # --- WHAT GOES INSIDE EACH MODULE (HARD constraint, added 2026-07-20) ---
        # Karim's correction after reviewing the first test Reel: the renders
        # were filling the TOP/upper cabinets with hanging clothes, which is
        # wrong for the real product. Upper cabinets are the linen/storage tier,
        # not a wardrobe tier. Any render showing an open upper cabinet with
        # clothes in it is wrong at the source and must be reworked.
        module_contents:
          upper_cabinets: "ONLY folded pillows, bedspreads, duvets, blankets and neatly
            stacked linen — this tier is bedding STORAGE. NEVER hanging clothes, NEVER
            garments on rails, NEVER shoes, in an upper cabinet."
          # UPGRADED 2026-07-20 (Karim): the hanging section was reading empty or
          # generic. It must look like a REAL, LIVED-IN wardrobe for a couple —
          # men's AND women's pieces together, not one gender, not a styled void.
          main_hanging_section: "a real couple's wardrobe, visibly BOTH men's and
            women's: men's shirts, suit jackets, trousers; women's dresses, blouses,
            coats, knitwear. Matched slim hangers, evenly spaced, realistic fabric
            drape. Folded garments and knitwear on the illuminated shelves. It must
            read lived-in and premium, never empty and never a single-gender rail."
          # CORRECTED 2026-07-21 (Karim): drawers were missing/misplaced in
          # renders. Real reference photos
          # (D:\DC Ref\modular wardrobe references\Sans titre-2_0029_DSC_1558.jpg
          # and others) show the actual layout: a stack of 2 to 4 drawers sits
          # at the BOTTOM of a module's INTERIOR, directly on the module floor,
          # under a shelf or the hanging zone above it (the pull-down lift or a
          # fixed rail). The drawers are wide, full-module-width, flush fronts
          # in the same finish as the doors, revealed only when that module's
          # door is opened — not a separate exterior drawer facade section.
          lower_modules: "shoes (men's and women's) in the lower shoe modules, and
            — inside whichever module is shown open — a stack of 2 to 4 drawers at
            the BOTTOM of that module's interior, directly on the module floor, below
            the hanging rail/lift zone above. Drawer fronts match the door's finish
            exactly. Plus the chosen premium accessory from the accessories folder."
          accessories_must_be_real: "the visible hardware must be the brand's REAL
            premium accessories from `Wardrobe premium accessories/` — pull-out shoe
            racks, tie/belt racks, pull-out trouser racks, sliding shelf dividers.
            Never invent generic organiser hardware."
          rule: "If a render shows an upper cabinet open or visible through glass,
            its contents MUST read as bedding/linen storage. This is checked at QC
            like any material law."

        # --- FACADE RULE (HARD constraint, added 2026-07-20) ---
        # Karim's correction: renders were showing large open carcasses with no
        # doors, which is not the product — Delta Cuisine sells fronted modular
        # wardrobes. Every module has a facade. The ONLY permitted open volume is
        # a deliberate, designed decorative niche.
        facades:
          rule: "EVERY module has a facade (a door/front). Never render a large open
            carcass, an entire facade-less bay, or a wall of exposed shelving as if
            that were the product."
          open_volumes_allowed: "only as a deliberate DECORATIVE NICHE — a small,
            intentional recessed display opening (LED-lit, framed, styled with a couple
            of objects), clearly designed rather than a missing door."
          showing_interiors: "to show the inside, OPEN a door or PULL OUT a drawer/rack
            so the facade is visibly present and open — never simply omit the front."
          # ADDED 2026-07-21 (Karim, after the v4 Reel): the renders were showing
          # interiors as if the door had vanished. An "open" module still has its
          # door — it is hinged/slid aside, IN FRAME. This is the difference
          # between a photo of our product and a photo of a shelving unit.
          door_visible_when_open: "when a module is shown OPEN, its door MUST be visibly
            present in the frame, still attached on its hinges or slid aside on its
            track — the door panel, its edge thickness, its handle and its inner face
            are part of the shot. NEVER render an open module whose door has simply
            disappeared. An interior with no door in frame is a rejected render, not
            a styling choice."
          never: "a facade-less module presented as a finished wardrobe, or an open
            module whose door is absent from frame"
          # ADDED 2026-07-21 (Karim, same review): the fronts were coming back
          # chopped into stacked upper/lower panels, which reads as budget
          # cabinetry. The product's signature is the uninterrupted tall front.
          # ADDED 2026-07-21 (Karim): "the wardrobe must not look weird, it must
          # look like real life with right proportions."
          buildable_realism: "the wardrobe must look like a REAL, BUILDABLE piece
            of furniture at true human scale, not an AI approximation. Door widths
            in a believable 40-60cm range and consistent with each other; hanging
            rails at a reachable height; drawers of realistic depth; shelves thick
            enough to be real board; hardware sized to a human hand. Garments, shoes
            and accessories must be correctly scaled against the module that holds
            them."
          never_weird: "no impossible or nonsensical construction — a rail with no
            clearance to hang from, a drawer that could not open, a shelf floating
            unsupported, a module too shallow for the clothes in it, a door too narrow
            or too wide for its opening, or hardware at the wrong scale. If a detail
            could not be manufactured and installed, it is wrong."
          swing_doors: "doors are HINGED SWING doors unless a sliding system is explicitly
            specified for that concept. Show the hinge side and let the panel stand
            proud of the facade when open. Never render a door sliding on a track,
            overlapping in front of a neighbouring panel, or recessed into a pocket,
            when a swing door was intended."
          tall_doors: "in MOST cases the fronts are FULL-HEIGHT TALL DOORS — one continuous
            door panel running the module's whole height, floor to ceiling. NOT a
            module divided horizontally into separate stacked upper and lower door
            panels. The uninterrupted vertical front is the product's signature; a
            horizontally split facade is the exception, never the default."
          drawer_facades: "a drawer front is the SAME material, colour, finish and
            texture as the main door facades — it reads as a continuous part of the
            same front. NEVER a contrasting, different-texture or different-colour
            drawer facade."
          # ADDED 2026-07-21 (Karim): Shots 2 and 3 were rendering a DIFFERENT
          # wardrobe from the hero — wider modules than the hero's actual panel
          # rhythm, and exposed hinge hardware the hero's design does not have.
          # CORRECTED 2026-07-21 (Karim): the "concealed hinges" rule below was
          # WRONG — it was inferred from the hero image alone, without checking
          # real product photography. Karim's own branded reference photo
          # (D:\DC Ref\modular wardrobe references\Sans titre-2_0008_DSC_1600.jpg,
          # visible "dc delta cuisine" logo on the hinge arm) and several others
          # in that folder show the REAL product uses standard visible chrome/
          # nickel European cup hinges on every opening door. Do not fight this
          # with negative prompts — it is correct, expected, and matches the
          # brand's actual hardware.
          hinge_visibility: "every opening door uses a REAL, VISIBLE European cup
            hinge in polished chrome or brushed nickel — the standard hardware visible
            on the door's inner edge whenever it stands open. This is correct and
            must be shown, not hidden. It is small, precise hardware (a hinge cup
            + arm), never oversized, never a decorative or ornate hinge. Do not render
            a bare hinge-free edge."
          module_width_match: "the hero's doors are NARROW and UNIFORM — count and
            measure them before opening one. An opened door must be the SAME WIDTH
            as its closed neighbours in the hero, never a wider merged opening. If
            a supporting shot's opening reads wider than one of the hero's actual
            panels, the render is wrong at the source: it shows a different wardrobe
            with fewer, wider modules, not this product."
          # ADDED 2026-07-21 (Karim): the whole wardrobe is ONE continuous run of
          # full-height doors — never a separate smaller box/cabinet unit (its
          # own shorter doors, its own frame, sitting above or beside the main
          # run) bolted onto the design. That reads as two different pieces of
          # furniture stacked together, not one built-in wardrobe.
          single_continuous_run: "EVERY door in the wardrobe runs the FULL height
            from floor to ceiling — no exceptions, no added box. Never render a separate
            smaller cabinet, overhead box, bridging unit or shorter-door module stacked
            above or beside the main run with its own distinct doors/frame. One wardrobe,
            one continuous facade, one door height throughout. If the concept shows
            anything that reads as a second, separate unit, it is wrong and must be
            reworked before it counts as an asset."
        # DEDICATED Magnific space for wardrobe generation — added 2026-07-20,
        # REBUILT same day as a real node-graph workflow ("Modular wardrobe
        # claude" — see .claude/skills/magnific-space-expert/SKILL.md for how
        # to read/run/edit it). SEPARATE from the brand's kitchen space above
        # (magnific_space / "master space for kitchen DC"). Every wardrobe
        # render — image or video — goes into THIS space; every kitchen render
        # goes into the brand's main magnific_space. Mixing them puts wardrobe
        # generations in the wrong Magnific project and must never happen.
        #
        # This space's own node graph now encodes the hard rules directly
        # (conception-reference anchoring, max-2-materials, mandatory 1-3
        # accessories, negative prompt, hero-2K/supporting-1K cost split) —
        # not just this brands.yaml block. If they ever disagree, this file
        # still wins; fix the space's nodes to match, not the other way round.
        magnific_space: "https://www.magnific.com/app/spaces/a24e4d72-2ef9-4d1a-9e55-2de12fad843a"
        magnific_space_name: "Modular wardrobe claude"
        # SUPERSEDED 2026-07-20, reference only, NOT a real key (a real key
        # here gets auto-rendered into every brief by _render_design_rules —
        # this historical pointer must never appear next to the live space
        # above where it could read as a second valid option). The original
        # manually-provided wardrobe space, "DC wardrobe space", was:
        # https://www.magnific.com/app/spaces/a24c8e62-db51-4a1e-90da-635767148b7e?page=1
        #
        # NEW master-anchored TEST space (built 2026-07-22, "Wardrobe
        # Master-Anchored (Claude)") — encodes the full fixed pipeline as a
        # node graph: master (Nano Banana Pro 2K) -> 6 derived shots (Flash 1K,
        # each inherits the master via image reference) -> 6 camera-only Kling
        # 2.5 720p clips -> combine. Karim is live-testing it manually before it
        # replaces the CM's live space above. Commented (reference only) so it is
        # NOT auto-rendered as a second live pointer. Before running, fill the
        # CONCEPTION REFERENCE + ACCESSORY PHOTOS nodes and the CONFIG material.
        # When validated, promote it into `magnific_space` above.
        # https://www.magnific.com/app/spaces/a251c2a9-b6f2-4440-a3aa-e1dc0298d26f

        # --- CONCEPTION REFERENCE PROTOCOL (HARD constraint, weekly planning) ---
        # Added 2026-07-09. Past CM wardrobe concepts drifted away from the real
        # Delta Cuisine product line — they invented layouts we do not build.
        # Every new wardrobe conception MUST be anchored to the reference images
        # below: keep their GLOBAL CONCEPTION (module layout, proportions, door
        # division, structure). Only the texture, the ambiance and the setting
        # may change. Do not invent a new wardrobe form.
        conception_reference:
          # Folder is relative to project_dir; the CM runs with cwd = project_dir,
          # so "modular wardrobe references/..." resolves directly.
          reference_dir: "modular wardrobe references"
          reference_images:
          - "modular wardrobe references/modular wardrobe ref.png"
          - "modular wardrobe references/modular wardrobe ref2.png"
          - "modular wardrobe references/modular wardrobe ref3.png"
          - "modular wardrobe references/modular wardrobe ref4.png"
          - "modular wardrobe references/modular wardrobe ref5.png"
          - "modular wardrobe references/modular wardrobe ref6.png"
          must_match: "module layout, proportions, door division, overall structure"
          may_vary: "texture, colour, ambiance, lighting, scene/setting"
          materials_from: "texture_folder"     # pick materials ONLY from the swatch
                                               # library (bois/, Ceramique/, Quartz/) —
                                               # never invent a material name
          rule: "Before concepting any wardrobe, OPEN the reference images and reproduce
            their global conception. The concept must state WHICH reference it follows.
            A wardrobe whose layout does not correspond to one of these references
            is wrong and must be reworked BEFORE it counts as an asset — same gate
            as the material-harmony laws above."

        # --- PREMIUM ACCESSORIES (MANDATORY, HARD constraint) ---
        # Added 2026-07-12. Upgraded from optional to MANDATORY 2026-07-20:
        # D:\my workflow\CLAUDE.md (2026-07-19) states as a cross-cutting rule for
        # ALL THREE wardrobe configurations that accessories are ALWAYS shown, with
        # interior fittings visible in or through the wardrobe. This file had them
        # as optional add-ons, so wardrobe renders could legitimately ship with
        # none — which is not what the brand actually sells.
        #
        # Mandatory PRESENCE, disciplined QUANTITY: every wardrobe visual shows
        # accessories, but only 1-3 of them, each with a stated position. Both
        # halves matter — "always show them" without the cap produces a hardware
        # catalogue, the cap without "always" produces empty wardrobes.
        accessories:
          required: true          # every wardrobe visual shows interior fittings
          accessories_dir: "Wardrobe premium accessories"   # relative to project_dir
          # SCOPE CLARIFIED 2026-07-21 (Karim). This used to read as per-image,
          # which forced even the hero to stand with a door hanging open. The
          # requirement is per ASSET SET: a Reel must reveal its accessories in
          # at least one shot, and a standalone single image must show them.
          visibility: "interior fittings must be VISIBLE — through glass doors, or
            with a module shown open. For a multi-shot Reel this is satisfied ACROSS
            THE SET: the hero may be fully closed to show the tall facades, provided
            at least one supporting shot opens a door to reveal the accessory. A standalone
            single image must still show them itself."
          select: "a SMALL SUBSET per generation — 1 to at most 3 accessories in any
            single image or reel. NEVER place every accessory from the folder into
            one generation; that reads as a hardware catalogue, not a lifestyle shot."
          # ADDED 2026-07-21 (Karim): the hanger lift is the signature fitting and
          # must appear in every wardrobe asset set, accompanied by exactly two
          # others — that is the "1 to 3" cap spent as 1 mandatory + 2 chosen.
          always_include: "`starax hanger lift.jpg` — the pull-down wardrobe lift.
            It appears in EVERY wardrobe asset set, plus exactly TWO other accessories
            chosen from the folder and varied across the week."
          starax_description: "a pull-down hanging rail for a high module: two matte-black
            articulated scissor arms mounted on the module's side panels, carrying
            a horizontal brushed-chrome/aluminium hanging bar. At rest it sits high
            inside the module; in use it swings DOWN and FORWARD, bringing the hanging
            garments down to reach. Render it mid-travel, pulled down and forward
            with clothes hanging from the chrome bar, so the mechanism reads clearly."
          placement: "the concept MUST state WHERE each chosen accessory sits inside
            the wardrobe (e.g. 'shoe rack in the lower left module', 'tie/belt rack
            mounted on the door-side rail of the hanging section') — grounded in the
            module layout of whichever conception_reference image the wardrobe follows.
            An accessory floating with no stated module/position is wrong."
          vary_across_week: "do not reuse the same accessory combination twice in
            one week's assets"
          never: "invent an accessory that is not a real file in accessories_dir,
            or fill every module of the wardrobe with accessories — leave most of
            the wardrobe clean, accessories are an accent on ONE module"
      inspiration:
        source: "pinterest"
        rule: "get inspired from Pinterest references before concepting; do not invent
          layouts blind"
      typography:
        french: "Helvetica Neue LT Pro"   # use for ALL French text (captions, on-image
          # text/overlays, design-tip graphics) across Delta Cuisine creations
    posting_schedule:            # local time (Africa/Tunis)
    - {day: monday, time: "18:00", type: "lifestyle / avant-après reel"}
    - {day: wednesday, time: "14:00", type: "promo image (alternating months)"}
    - {day: wednesday, time: "19:00", type: "design-tip reel"}
    - {day: thursday, time: "18:30", type: "nouveauté/tendance reel (best day)"}
    - {day: saturday, time: "15:00", type: "educational montage reel (best day)"}
    posting_windows:
      primary: "18:00-19:30"
      secondary: "13:00-14:30"
      best_days: [thursday, friday, saturday]
      avoid: ["wednesday", "sunday", "06:00-09:00", "21:00-23:00"]

