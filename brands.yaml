    content_mix:
      # REVISED 2026-07-16 per user mandate (performance-report follow-up):
      # minimum 5 posts/week, split 3+2 either direction (3 carousels+2 reels OR
      # 3 reels+2 carousels). CM's standing call: 3 carousels + 2 reels — the
      # strategic report shows carousels win on engagement-per-reach (2.35% vs
      # 1.79%) and were the under-used format (was ~1 carousel : 2 reels), so the
      # extra volume goes to the format with the better return, not a coin flip.
      # Superseded: the old "2-3 reels + 2 carousels + 1 promo poster/week" mix.
      reels_per_week: 2
      carousels_per_week: 3
      promo_posters_per_week: 0                   # no standing promo cadence; only when a real offer exists (charter §4.3)
      formats: [reel, carousel, promo_poster]
      # Description language: FR or AR (Tunisian dialect). The caption FOOTER is
      # chosen to MATCH the description language — French body -> caption_footer,
      # Arabic body -> caption_footer_ar (below). build_brief enforces this.
      description_languages: [fr, ar]            # ar = Tunisian dialect
      mandatory_weekly:
      - "minimum 5 posts/week: 3 carousels + 2 reels (2026-07-16 mandate)"
      - "winning caption structure on every product post: hook -> concrete benefit
        -> price/offer -> clear CTA (phone/address/DM)"
      - "no duplicate / near-identical posts within the same week (report flagged
        reach cannibalization) — same-format posts must be spaced across different
        days, never same day/near-simultaneous"
      - "caption footer language MUST match the description language (fr->caption_footer,
        ar->caption_footer_ar)"
    # REVISED 2026-07-16 to fit 5 posts/week onto the report's proven-good days
    # (Tue/Wed/Fri) plus Thursday (weak but never flagged "avoid" — only Mon/Sat/
    # Sun are). Friday now carries 2 posts (reel AM, carousel PM) spaced 4h apart
    # so they don't read as a same-slot duplicate. Superseded: the old 3-slot
    # (Tue reel / Wed carousel / Fri test) schedule from Rapport_Strategique §8.
    posting_schedule:
    - {day: tuesday, time: "11:00", type: "product reel (reach)"}
    - {day: wednesday, time: "13:00", type: "product/promo carousel (engagement)"}
    - {day: thursday, time: "13:00", type: "product carousel (engagement)"}
    - {day: friday, time: "11:00", type: "test slot: testimonial / avant-après reel"}
    - {day: friday, time: "15:00", type: "product carousel (engagement)"}
    posting_windows:
      primary: "10:00-15:00"                     # report: top posts landed 09:59-13:34
      best_days: [tuesday, wednesday, thursday, friday]  # report: Mon oversaturated & weak; Tue/Wed reliable; Fri high potential; Thu added 2026-07-16 to fit the 5-post mandate (never on the "avoid" list)
      avoid: ["monday", "saturday", "sunday"]
    # --- caption rules (body text the CM writes, above the footer) ---
    # no_emoji governs the BODY the CM writes. The caption_footer blocks below are
    # the fixed brand signature and are appended VERBATIM, emoji included — the
    # rule does not strip them.
    caption_rules:
      no_emoji: true               # user rule 2026-07-09: zero emoji in the description body

    # Appended VERBATIM to the end of every Ceram Quartz caption (product posts,
    # carousels, and any manually-created reel Era is asked to publish/schedule).
    # Era writes the post-specific body ABOVE this block in the brand's style, then
    # appends this block unchanged. 5 hashtags = the hashtag_max ceiling.
    caption_footer: |
      📍 Venez découvrir cette pierre d'exception dans notre showroom à La Soukra !
      📞 Contactez-nous pour un devis gratuit ou plus d'informations au : +216 98 522 200 / 98 522 210
      Ceram Quartz — Pierre façonnée selon vos envies.
      #CeramQuartz #Quartz #CuisineModerne #PlanDeTravail #Tunisie
    # Arabic (Tunisian dialect) footer — appended VERBATIM instead of the French
